services:
  - type: web
    name: threatlens
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/threatlens.db
      - key: GROQ_API_KEY
        sync: false
